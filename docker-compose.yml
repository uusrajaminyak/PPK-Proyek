services:
    web:
        image: nginx:alpine
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html:cached
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:cached
        depends_on:
            - app

    app:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        volumes:
            - ./:/var/www/html:cached
            - vendor_data:/var/www/html/vendor
            - storage_views:/var/www/html/storage/framework/views
            - storage_sessions:/var/www/html/storage/framework/sessions
            - storage_cache:/var/www/html/storage/framework/cache
        depends_on:
            - db

    db:
        image: postgres:15-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

volumes:
    db_data:
    vendor_data:
    storage_views:
    storage_sessions:
    storage_cache:
